# Model Configuration for WriteHERE
# This file defines model configurations for different tasks
# Supports LiteLLM for unified API access to multiple LLM providers

# Default models for different modes
defaults:
  story_model: "gpt-4o"              # Default model for story generation
  report_model: "gpt-4o"             # Default model for report generation
  selector_model: "gpt-4o-mini"      # Model for selecting relevant search results
  summarizer_model: "gpt-4o-mini"    # Model for summarizing search results

# LiteLLM Configuration (optional)
# If use_litellm is true, all models will be routed through LiteLLM
litellm:
  enabled: false                     # Set to true to enable LiteLLM
  base_url: null                     # LiteLLM proxy URL (e.g., "http://localhost:4000")
  api_key: null                      # LiteLLM API key (if required)

# Model definitions with detailed configurations
models:
  # OpenAI GPT-4o
  gpt-4o:
    provider: "openai"
    display_name: "GPT-4o"
    temperature:
      composition: 0.3    # For writing tasks
      reasoning: 0.3      # For thinking tasks
      planning: 0.1       # For planning and atomic tasks
    max_tokens: 4096
    supports_vision: true
    # Optional: Override base_url and api_key for this specific model
    # base_url: "https://api.openai.com/v1"
    # api_key: "your-api-key-here"  # Or use env var reference: "${OPENAI_API_KEY}"

  # OpenAI GPT-4o-mini
  gpt-4o-mini:
    provider: "openai"
    display_name: "GPT-4o Mini"
    temperature:
      composition: 0.3
      reasoning: 0.3
      planning: 0.1
    max_tokens: 4096
    supports_vision: true

  # OpenAI o1
  o1:
    provider: "openai"
    display_name: "OpenAI o1"
    temperature:
      composition: 1.0    # o1 models have fixed temperature
      reasoning: 1.0
      planning: 1.0
    max_tokens: 8192
    supports_vision: false

  # Anthropic Claude 3.5 Sonnet
  claude-3-5-sonnet-20241022:
    provider: "anthropic"
    display_name: "Claude 3.5 Sonnet"
    temperature:
      composition: 0.3
      reasoning: 0.3
      planning: 0.1
    max_tokens: 8192
    supports_vision: true

  # Anthropic Claude 3.7 Sonnet
  claude-3-7-sonnet-20250219:
    provider: "anthropic"
    display_name: "Claude 3.7 Sonnet"
    temperature:
      composition: 0.3
      reasoning: 0.3
      planning: 0.1
    max_tokens: 8192
    supports_vision: true

  # Google Gemini 2.5 Pro
  gemini-2.5-pro-preview-03-25:
    provider: "gemini"
    display_name: "Gemini 2.5 Pro Preview"
    temperature:
      composition: 0.3
      reasoning: 0.3
      planning: 0.1
    max_tokens: 8192
    supports_vision: true

  # Google Gemini 2.0 Flash
  gemini-2.0-flash:
    provider: "gemini"
    display_name: "Gemini 2.0 Flash"
    temperature:
      composition: 0.3
      reasoning: 0.3
      planning: 0.1
    max_tokens: 8192
    supports_vision: true

  # OpenRouter Google Gemini (via OpenRouter)
  google/gemini-2.5-pro-preview-03-25:
    provider: "openrouter"
    display_name: "Gemini 2.5 Pro (via OpenRouter)"
    temperature:
      composition: 0.3
      reasoning: 0.3
      planning: 0.1
    max_tokens: 8192
    supports_vision: true

# Predefined model sets for different use cases
presets:
  # High quality, slower, more expensive
  premium:
    story_model: "claude-3-7-sonnet-20250219"
    report_model: "gpt-4o"
    selector_model: "gpt-4o-mini"
    summarizer_model: "gpt-4o-mini"

  # Balanced quality and cost
  balanced:
    story_model: "gpt-4o"
    report_model: "gpt-4o"
    selector_model: "gpt-4o-mini"
    summarizer_model: "gpt-4o-mini"

  # Fast and economical
  economy:
    story_model: "gpt-4o-mini"
    report_model: "gpt-4o-mini"
    selector_model: "gpt-4o-mini"
    summarizer_model: "gpt-4o-mini"

  # Google Gemini focused
  gemini:
    story_model: "gemini-2.5-pro-preview-03-25"
    report_model: "gemini-2.5-pro-preview-03-25"
    selector_model: "gemini-2.0-flash"
    summarizer_model: "gemini-2.0-flash"

  # Claude focused
  claude:
    story_model: "claude-3-7-sonnet-20250219"
    report_model: "claude-3-5-sonnet-20241022"
    selector_model: "gpt-4o-mini"
    summarizer_model: "gpt-4o-mini"

# Advanced settings
advanced:
  # Enable model fallback on error
  enable_fallback: false

  # Fallback model chain (used if enable_fallback is true)
  fallback_chain:
    - "gpt-4o"
    - "claude-3-5-sonnet-20241022"
    - "gpt-4o-mini"

  # Max retries for API calls
  max_retries: 3

  # Timeout for API calls (seconds)
  timeout: 120

# ============================================================================
# LiteLLM Usage Examples
# ============================================================================
#
# Example 1: Use LiteLLM proxy for all models
# --------------------------------------------
# litellm:
#   enabled: true
#   base_url: "http://localhost:4000"  # Your LiteLLM proxy URL
#   api_key: "sk-1234"                  # Optional: LiteLLM proxy API key
#
# Then all model calls will go through LiteLLM proxy
#
# Example 2: Use custom OpenAI-compatible endpoint
# -------------------------------------------------
# models:
#   custom-gpt-4:
#     provider: "openai"
#     display_name: "Custom GPT-4"
#     base_url: "https://your-custom-endpoint.com/v1"
#     api_key: "${CUSTOM_API_KEY}"  # Reference environment variable
#     temperature:
#       composition: 0.3
#       reasoning: 0.3
#       planning: 0.1
#     max_tokens: 4096
#
# Example 3: Use LiteLLM with specific model
# -------------------------------------------
# models:
#   deepseek-chat:
#     provider: "litellm"  # Use litellm provider
#     display_name: "DeepSeek Chat"
#     base_url: "http://localhost:4000"
#     api_key: "sk-1234"
#     temperature:
#       composition: 0.3
#       reasoning: 0.3
#       planning: 0.1
#     max_tokens: 8192
#
# Example 4: Use local LLM via LiteLLM
# -------------------------------------
# models:
#   local-llama:
#     provider: "openai"  # OpenAI-compatible API
#     display_name: "Local Llama"
#     base_url: "http://localhost:8000/v1"
#     api_key: "not-needed"  # Some local servers don't require API key
#     temperature:
#       composition: 0.7
#       reasoning: 0.5
#       planning: 0.3
#     max_tokens: 4096
